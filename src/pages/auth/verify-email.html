<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify email | ACTUAL HOLDINGS</title><link href="../../styles/style.css" rel="stylesheet"><link rel="icon" href="../../../images/favicon.svg"></head><body class="auth-page"><main class="auth-shell"><section class="auth-showcase"><a class="auth-brand" href="../../../index.html"><span class="auth-brand-mark"><img src="../../../images/actual-logo.jpeg" alt=""></span><span>ACTUAL <small>HOLDINGS</small></span></a><div class="auth-showcase-content"><span class="auth-eyebrow">Email security</span><h1>One more step<br>to get started.</h1><p>Verify your email address to activate your ACTUAL HOLDINGS client account.</p></div><div class="auth-showcase-footer">Kigali, Rwanda · Actual Holdings Co Ltd</div></section><section class="auth-form-panel"><div class="auth-form-wrap"><h2>Verify your email</h2><p>Enter the six-digit code sent to your email address.</p><form id="verify-form" class="auth-form"><div class="form-group"><label class="form-label" for="verify-email">Email address</label><input class="form-control" id="verify-email" type="email" required autocomplete="email"></div><div class="form-group"><label class="form-label" for="verify-code">Verification code</label><input class="form-control" id="verify-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" minlength="6" required autocomplete="one-time-code" placeholder="000000"></div><button class="auth-submit" type="submit">Verify email</button></form><button id="resend-code" class="auth-submit" type="button" style="margin-top:12px;background:#fff;color:#123e35;border:1px solid #123e35">Resend code</button><p id="verify-message" role="status" aria-live="polite"></p><p class="auth-switch"><a href="login.html">Return to login</a></p></div></section></main><script src="../../scripts/auth-api.js" defer></script></body></html>
